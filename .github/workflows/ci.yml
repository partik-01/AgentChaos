name: Agent Chaos validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,openai]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - run: agent-chaos compare scenarios --trials 3 --seed 17 --out runs/fixed
      - run: agent-chaos compare scenarios/heldout --trials 5 --seed 17 --out runs/heldout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence-python-${{ matrix.python-version }}
          path: runs/
